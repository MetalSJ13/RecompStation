# Builds the Linux release files: an AppImage and a portable zip, both
# x86_64 with Qt included. Run it from the Actions tab to get the files as a
# workflow artifact for testing (changes to the packaging run it too);
# pushing a tag such as v0.1.0 (matching the
# version in CMakeLists.txt) also drafts a GitHub release with them, to be
# reviewed and published by hand.
name: Linux release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Also when the packaging itself changes, on any branch, so it can be
    # tested before it reaches main (hand-started runs need it on main).
    branches: ['**']
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package.sh'
      - 'packaging/**'

permissions:
  contents: write

jobs:
  linux-x86_64:
    # The oldest supported runner: the files run on systems with this glibc
    # (2.35) or newer.
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: 6.8.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build id in the log comes from git describe

      - name: Check the version
        run: |
          version="$(sed -n 's/^    VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)"
          echo "CMakeLists.txt version: $version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in CMakeLists.txt ($version)."
            exit 1
          fi

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build file zip patchelf desktop-file-utils \
            libarchive-dev libsdl2-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype6-dev libdbus-1-3 libwayland-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      - name: Keep only Qt's SQLite driver
        # The others need database client libraries that aren't bundled.
        # Each driver's CMake entry goes with it, or Qt's CMake files refer
        # to a missing file.
        run: |
          for driver in "$QT_ROOT_DIR"/plugins/sqldrivers/libqsql*.so; do
            name="$(basename "$driver" .so)"; name="${name#libqsql}"
            [[ "$name" == "ite" ]] && continue   # libqsqlite: SQLite, kept
            rm -v "$driver"
            find "$QT_ROOT_DIR/lib/cmake/Qt6Sql" -iname "Qt6Q${name}*DriverPlugin*.cmake" -print -delete
          done
          ls "$QT_ROOT_DIR/plugins/sqldrivers" "$QT_ROOT_DIR/lib/cmake/Qt6Sql"

      - name: Build, test and package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          desktop-file-validate packaging/io.github.MetalSJ13.RecompStation.desktop
          QMAKE="$QT_ROOT_DIR/bin/qmake" ./scripts/package.sh --test

      - name: Keep the files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecompStation-linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Draft the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/$version/g" packaging/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "RecompStation $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
