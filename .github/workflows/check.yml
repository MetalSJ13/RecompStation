# A quick check on every push that changes the program: builds it on Linux
# and runs the tests, nothing packaged. Compiled files are kept between runs
# (ccache), so a change to a few files builds in about a minute. The Linux
# release files come from release.yml and the Windows build from windows.yml.
name: Check

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/check.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'qml/**'
      - 'tests/**'
      - 'data/**'
      - 'shaders/**'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: '6.10.*'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build id in the log comes from git describe

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libarchive-dev libsdl2-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype6-dev libdbus-1-3 libwayland-dev

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      - name: Restore compiled files
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Build and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ccache --max-size=500M
          ./scripts/build.sh --test
          ccache --show-stats
