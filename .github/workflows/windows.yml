# Builds the Windows version: RecompStation.exe with Qt, SDL2 and libarchive
# beside it, as a portable zip (x86_64), kept as a workflow artifact for
# testing. It takes a while, so on a working branch it runs only when the
# commit message says [windows] (and the commit changes one of the paths
# below: a commit that changes only DEVELOPMENT.md starts nothing); pushes to
# ui/interface-redesign and main (merges) always run it, and so does the
# Actions tab once it is on main. A tag such as v0.2.0 adds the zip to the
# release the Linux workflow drafts for that tag, but only once the repository
# variable WINDOWS_RELEASES is set to true (Settings > Secrets and variables >
# Actions > Variables): releases are Linux-only until the Windows version is
# signed and has an installer (decided 2026-11-27, v0.1.2).
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['**']
    # Any change to the program, so the Windows build stays working.
    paths:
      - '.github/workflows/windows.yml'
      - 'packaging/windows/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'qml/**'
      - 'tests/**'
      - 'data/**'
      - 'shaders/**'

permissions:
  contents: write   # adding the zip to a drafted release

jobs:
  windows-x86_64:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' && vars.WINDOWS_RELEASES == 'true') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/ui/interface-redesign' ||
      contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-2022
    env:
      QT_VERSION: '6.10.*'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-cache,readwrite'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build id in the log comes from git describe

      # The runner's vcpkg changes now and then, and packages built by an
      # older one aren't reused, so its version is part of the cache name;
      # otherwise an old cache keeps matching and every run builds them all
      # again (13 minutes).
      - name: Find the vcpkg version
        id: vcpkg-version
        run: |
          "commit=$(git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-libarchive-sdl2-${{ steps.vcpkg-version.outputs.commit }}
          restore-keys: vcpkg-x64-windows-libarchive-sdl2-

      - name: Install libarchive and SDL2 (vcpkg)
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libarchive:x64-windows sdl2:x64-windows

      # Saved right away, so a later failing step doesn't throw the
      # (slow) library builds away.
      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-libarchive-sdl2-${{ steps.vcpkg-version.outputs.commit }}

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Set up the MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build --output-on-failure --timeout 120
          if ($LASTEXITCODE -ne 0) {
            # Each failed test again, writing its results to a file, with its
            # exit code (a test that can't start prints nothing).
            $failed = Get-Content build\Testing\Temporary\LastTestsFailed.log | ForEach-Object { ($_ -split ':')[1] }
            foreach ($test in $failed) {
              Write-Host "===== $test"
              $log = Join-Path (Resolve-Path build) "$test-results.txt"
              $p = Start-Process -FilePath "build\$test.exe" -ArgumentList "-o", "$log,txt" `
                     -WorkingDirectory build -NoNewWindow -PassThru
              if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "(stopped after 60 s)" }
              Write-Host ("exit code: 0x{0:X8}" -f $p.ExitCode)
              if (Test-Path $log) { Get-Content $log | Select-String -NotMatch '^PASS ' }
            }
            exit 1
          }

      # Packaged even when a test fails, so the build can still be tried.
      - name: Package the portable zip
        if: always() && steps.build.outcome == 'success'
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s+VERSION (\d+\.\d+\.\d+)$').Matches[0].Groups[1].Value
          $name = "RecompStation-$version-windows-x86_64"
          $dir = "dist\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build\RecompStation.exe $dir
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir qml --no-translations `
            --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$dir\RecompStation.exe"
          # The Visual C++ runtime beside the program, so nothing has to be
          # installed first.
          Copy-Item "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT\*.dll" $dir
          # libarchive, SDL2 and the compression libraries libarchive uses.
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" $dir
          Copy-Item LICENSE "$dir\LICENSE.txt"
          Copy-Item packaging\THIRD_PARTY_NOTICES.md $dir
          New-Item -ItemType Directory -Force "$dir\licenses" | Out-Null
          Copy-Item packaging\licenses\* "$dir\licenses"
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\share\*\copyright" | ForEach-Object {
            Copy-Item $_.FullName "$dir\licenses\$($_.Directory.Name).txt"
          }
          Copy-Item packaging\windows\README.txt $dir
          Compress-Archive -Path $dir -DestinationPath "dist\$name.zip"
          Get-ChildItem $dir -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path $dir).Path.Length + 1) }

      - name: Keep the zip as a workflow artifact
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RecompStation-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

      # The Linux workflow drafts the release for the tag; this waits for it
      # (up to 40 minutes), then adds the zip and its line in SHA256SUMS.
      - name: Add the zip to the drafted release
        if: github.ref_type == 'tag' && steps.build.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          for attempt in $(seq 1 80); do
            gh release view "$tag" --json isDraft >/dev/null 2>&1 && break
            if [ "$attempt" = 80 ]; then echo "No release drafted for $tag"; exit 1; fi
            sleep 30
          done
          # SHA256SUMS only once the Linux files are on the release.
          for attempt in $(seq 1 20); do
            gh release download "$tag" --pattern SHA256SUMS --dir "$RUNNER_TEMP" --clobber 2>/dev/null && break
            sleep 15
          done
          cd dist
          zip="$(ls *.zip)"
          gh release upload "$tag" "$zip" --clobber
          if [ -f "$RUNNER_TEMP/SHA256SUMS" ]; then
            grep -v "  $zip\$" "$RUNNER_TEMP/SHA256SUMS" > SHA256SUMS || true
            sha256sum "$zip" >> SHA256SUMS
            gh release upload "$tag" SHA256SUMS --clobber
          fi
